upstream openwebui {
    server open-webui:8080;
}

upstream custom_api {
    server custom-api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # WebSocket support for Open WebUI's Socket.IO
    location /ws/ {
        proxy_pass http://openwebui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Custom API endpoints -- routed to your sidecar service
    location /api/custom/ {
        proxy_pass http://custom_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward the Open WebUI auth token so the sidecar can validate it
        proxy_set_header Authorization $http_authorization;
    }

    # Everything else goes to Open WebUI (API + SPA frontend)
    location / {
        proxy_pass http://openwebui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300;
    }
}
